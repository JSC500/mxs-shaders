name: Release

# Pushing a tag like v1.0.0 builds the DLL and the Linux library and publishes them as a GitHub
# release. Nothing is published unless both builds succeed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: build.bat

      - name: Package the shader packs
        shell: pwsh
        run: |
          Get-ChildItem shaderpacks -Directory | ForEach-Object {
            Compress-Archive -Path $_.FullName -DestinationPath "build\$($_.Name)-pack.zip"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            build/opengl32.dll
            build/*-pack.zip
          if-no-files-found: error

  linux:
    # An older Ubuntu keeps the glibc the library needs low, so more distributions can load it.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libx11-dev libfreetype-dev

      - name: Build
        run: make

      - name: Check the exports
        run: make exports

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            build/libmxs-shaders.so
            mxs-shaders.sh
          if-no-files-found: error

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Linux artifact keeps its build/ folder, because its files come from two folders.
          # Upload every file, wherever it sits, rather than what's at the top of dist.
          chmod +x dist/mxs-shaders.sh
          find dist -type f -print0 | xargs -0 gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --generate-notes
